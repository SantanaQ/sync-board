spring:
  application:
    name: sync-board

  sql:
    init:
      platform: postgres

  datasource:
    url: jdbc:postgresql://localhost:5432/syncboard # change to jdbc:postgresql://postgres:5432/syncboard when dockerized
    username: syncboard
    password: syncboard

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    validate-on-migrate: true
    validate-migration-naming: true

